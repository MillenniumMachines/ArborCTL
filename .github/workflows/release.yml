# Publish a GitHub Release with the DWC plugin ZIP only (ArborCTL-<semver>.zip).
# Trigger: push a release tag (vMAJOR.MINOR.PATCH, -beta.N, or -rcN).

on:
  push:
    tags:
      - 'v*'

name: Release DWC plugin

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArborCTL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semver release tag
        run: |
          chmod +x dist/verify-release-tag.sh
          dist/verify-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Resolve release version
        run: |
          set -euo pipefail
          # shellcheck source=dist/resolve-build-version.sh
          . dist/resolve-build-version.sh
          echo "BUILD_REF=${BUILD_REF}" >> "${GITHUB_ENV}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "PLUGIN_SEMVER=${BUILD_VERSION#v}" >> "${GITHUB_ENV}"
          echo "Resolved tag ${GITHUB_REF_NAME} → BUILD_REF=${BUILD_REF} BUILD_VERSION=${BUILD_VERSION} (sha ${BUILD_SHA})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone DuetWebControl (matches NeXT v0.7.0 / DWC 3.7 pin)
        run: |
          git clone --depth 1 -b v3.7.0-beta.1 https://github.com/Duet3D/DuetWebControl.git dwc-work
          cd dwc-work
          npm ci || npm install

      - name: Build plugin zip
        run: |
          chmod +x dist/build-dwc-plugin.sh dist/check-node-for-dwc-build.sh dist/resolve-build-version.sh
          dist/build-dwc-plugin.sh "$(pwd)/dwc-work"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/ArborCTL-${{ env.PLUGIN_SEMVER }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
